<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintainable Application Server</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <img src="/images/logo.png" alt="Framework logo" class="logo">
        <h1>Maintainable Application Server</h1>
    </header>

    <main>
        <section class="card">
            <h2>Greeting service</h2>
            <p>Calls <code>GET /hello</code> asynchronously with <code>fetch()</code>.</p>
            <input id="name" type="text" placeholder="Your name">
            <button onclick="greet()">Greet me</button>
            <p id="result" class="result"></p>
        </section>

        <section class="card">
            <h2>Pi service</h2>
            <p>Calls <code>GET /pi</code>, a second lambda-based endpoint.</p>
            <button onclick="fetchPi()">Get Pi</button>
            <p id="pi-result" class="result"></p>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
